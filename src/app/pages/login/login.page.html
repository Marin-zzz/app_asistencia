<ion-header>
  <ion-toolbar>
    <ion-title>
      <div class="logo-container">
       <img src="assets/logos/duoc-logo.png" alt="Duoc UC Seal" class="header-seal">
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Contenedor para centrar todo el contenido -->
  <div class="container-wrapper">

    <!-- El círculo negro principal que contiene el formulario -->
    <div class="login-container">
      
      <!-- Círculo amarillo con el ícono de usuario -->
      <div class="user-icon-container">
        <ion-icon name="person" color="light"></ion-icon>
      </div>

      <!-- El formulario va dentro del círculo -->
      <form [formGroup]="form" (ngSubmit)="login()" class="login-form">
        
        <ion-label>Correo:</ion-label>
        <ion-item lines="none">
          <ion-input formControlName="correo" type="email" placeholder=""></ion-input>
        </ion-item>

        <ion-label>Contraseña:</ion-label>
        <ion-item lines="none">
          <ion-input formControlName="contrasena" type="password" placeholder=""></ion-input>
        </ion-item>

      </form>
    </div>

    <!-- Botón de Entrar, fuera del círculo negro -->
    <ion-button class="login-button" (click)="login()">
      Entrar
    </ion-button>

    <!-- Mensaje de error (opcional) -->
    <p *ngIf="error" class="error-message">{{ error }}</p>

  </div>
</ion-content>
